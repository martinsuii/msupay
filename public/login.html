<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — NespPay</title>
  <link rel="stylesheet" href="account.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <span class="brand-dot"></span>
        <span class="brand-name">Nesp<span class="brand-accent">Pay</span></span>
      </a>
      <div class="nav-actions">
        <a class="nav-link" href="/register">Register</a>
        <button id="themeBtn" class="theme-btn" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <h1 class="title">Welcome back</h1>
      <p class="sub">Sign in to manage your merchant account.</p>
      <div class="error" id="error"></div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>
      <button id="loginBtn" class="btn">Sign in</button>
      <p class="hint">New here? <a href="/register">Register</a></p>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="login.js"></script>
</body>
</html>
