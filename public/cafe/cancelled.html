<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment cancelled — Nesp Café</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    const t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  </script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
        <span class="brand-name">Nesp<span class="brand-accent">Café</span></span>
      </div>
    </div>
  </header>

  <main class="result">
    <div class="result-icon pop">
      <svg class="cancel" viewBox="0 0 52 52">
        <circle class="cancel-circle" cx="26" cy="26" r="24"></circle>
        <path class="cancel-x" fill="none" d="M17 17l18 18M35 17L17 35"></path>
      </svg>
    </div>
    <h1 class="result-title">Payment cancelled</h1>
    <p class="result-sub">No worries — come back anytime.</p>
    <a class="back-btn" href="/">Back to café</a>
  </main>
</body>
</html>
